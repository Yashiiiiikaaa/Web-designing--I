<!DOCTYPE html>
<html>
<body>
    <form action="#" method="post">
        <input type="text" placeholder="Full name" required><br><br>
        <input type="email" placeholder="you@college.edu" required><br><br>
        <input type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile" required><br><br>
        <input type="password" minlength="6" placeholder="Min 6 characters" required><br><br>
        <input type="number" min="17" max="60" placeholder="Age (17+)" required><br><br>

        <input type="submit" value="Register">
    </form>
</body>
</html>
