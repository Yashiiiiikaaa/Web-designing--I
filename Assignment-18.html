<!DOCTYPE html>
<html>
<head>
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f4f4f4;
            margin: 20px;
        }
        .header {
            background-color: #0d3273;
            color: white;
            text-align: center;
            padding: 15px;
        }
        .container {
            width: 80%;
            margin: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
        }
        th {
            background-color: #d9dee6;
        }
        fieldset {
            border: 1px solid #888;
            padding: 15px;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="email"] {
            width: 300px;
        }
        textarea {
            width: 500px;
            height: 60px;
        }
        .footer {
            background-color: #0d3273;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ABC College Admission 2026</h1>
    </div>

    <div class="container">
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>₹45,000</td>
            </tr>
        </table>

        <form>
            <fieldset>
                <legend>Application Form</legend>

                Name:<br>
                <input type="text"><br><br>

                Email:<br>
                <input type="email"><br><br>

                Course:<br>
                <select>
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select><br><br>

                Statement:<br>
                <textarea></textarea><br><br>

                <input type="submit" value="Apply">
            </fieldset>
        </form>
    </div>

    <div class="footer">
        © 2026 ABC College
    </div>

</body>
</html>
